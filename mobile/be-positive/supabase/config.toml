project_id = "ktnhctzzgzbqhqtdijze"

# These functions are called from the app with the publishable anon key
# (not a legacy JWT), so gateway JWT verification must stay off. Keeping
# this declared here means every future `supabase functions deploy` picks
# it up automatically, instead of depending on remembering the
# --no-verify-jwt flag by hand.
[functions.chat]
verify_jwt = false

[functions.coach]
verify_jwt = false

[functions.daily-notification]
verify_jwt = false

# This one identifies the caller from their real session token, so the
# gateway's normal JWT check should stay on.
[functions.delete-account]
verify_jwt = true

# Public static pages (Privacy Policy / Terms), opened directly in a browser
# by users and App Store reviewers — no auth at all.
[functions.legal]
verify_jwt = false

# @react-native-google-signin's free tier can't surface the nonce Google's
# iOS SDK embeds in the ID token, so Supabase's nonce check on the token
# always fails ("Passed nonce and nonce in id_token should either both
# exist or not"). This only affects local `supabase start` — the hosted
# project needs the matching toggle turned on manually in the Dashboard:
# Authentication -> Providers -> Google -> "Skip Nonce Check".
[auth.external.google]
skip_nonce_check = true
