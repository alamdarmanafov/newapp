# EAS Build workflow for Be Positive mobile app
name: EAS Build (Be Positive)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: "EAS build profile"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/be-positive
    steps:
      - uses: actions/checkout@v4

      - name: Check EXPO_TOKEN secret reaches this job
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is EMPTY in this job"
          else
            echo "EXPO_TOKEN is set, length=${#EXPO_TOKEN}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: EAS Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
