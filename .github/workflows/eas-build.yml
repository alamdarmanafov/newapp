# EAS Build workflow for Be Positive mobile app
name: EAS Build (Be Positive)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: "EAS build profile"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development
      expo_token:
        description: "Temporary override: Expo access token (leave empty to use the EXPO_TOKEN repo secret)"
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/be-positive
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Expo token
        run: |
          TOKEN="${{ inputs.expo_token }}"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "EXPO_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          elif [ -n "$SECRET_TOKEN" ]; then
            echo "::add-mask::$SECRET_TOKEN"
            echo "EXPO_TOKEN=$SECRET_TOKEN" >> "$GITHUB_ENV"
          else
            echo "::error::No Expo token available (neither expo_token input nor EXPO_TOKEN secret)"
            exit 1
          fi
        env:
          SECRET_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest

      - run: npm ci

      - name: EAS Init (link/create EAS project if needed)
        run: |
          if ! grep -q '"projectId"' app.json 2>/dev/null; then
            eas init --non-interactive --account bepositiveapp
            echo "--- app.json after eas init ---"
            cat app.json
          else
            echo "projectId already present, skipping eas init"
          fi

      - name: EAS Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
